---
# Musa role - Twenty CRM deployment behind Caddy + Cloudflare Tunnel
# (SWAG retired 2026-08-18 — see CLAUDE.md "Ingress Migration")
#
# Requires extra-vars: pg_password, app_secret, encryption_key,
#   twenty_api_key, ghcr_pat
# Assumes: LXC container with standard Ubuntu template (Docker NOT pre-installed)
# Assumes: {{ app_data_dir }}/cloudflared/credentials.json already on the host
#   (created once by `cloudflared tunnel create` — checked below, never templated)

- name: Validate required variables
  ansible.builtin.assert:
    that:
      - pg_password is defined
      - pg_password | length > 0
      - app_secret is defined
      - app_secret | length > 0
      - encryption_key is defined
      - encryption_key | length > 0
      - twenty_api_key is defined
      - twenty_api_key | length > 0
      - ghcr_pat is defined
    fail_msg: "Required variables must be set (see role defaults for list)"
    success_msg: "Required variables are configured"
  tags: [always]

# ============================================================================
# DOCKER INSTALLATION (LXC containers use standard Ubuntu template)
# ============================================================================

- name: Install Docker prerequisites
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
    state: present
    update_cache: true
  tags: [deploy]

- name: Add Docker GPG key
  ansible.builtin.shell:
    cmd: |
      install -m 0755 -d /etc/apt/keyrings
      curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
      chmod a+r /etc/apt/keyrings/docker.asc
    creates: /etc/apt/keyrings/docker.asc
  tags: [deploy]

- name: Add Docker APT repository
  ansible.builtin.shell:
    cmd: >-
      echo "deb [arch=$(dpkg --print-architecture)
      signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/linux/ubuntu
      $(. /etc/os-release && echo "$VERSION_CODENAME") stable"
      > /etc/apt/sources.list.d/docker.list
    creates: /etc/apt/sources.list.d/docker.list
  tags: [deploy]

- name: Install Docker and Docker Compose plugin
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-compose-plugin
    state: present
    update_cache: true
  tags: [deploy]

- name: Ensure Docker service is running and enabled
  ansible.builtin.systemd:
    name: docker
    state: started
    enabled: true
  tags: [deploy]

# ============================================================================
# GHCR AUTHENTICATION (for private images)
# ============================================================================

- name: Log in to GHCR
  ansible.builtin.command:
    cmd: docker login ghcr.io -u poindexter12 --password-stdin
    stdin: "{{ ghcr_pat }}"
  changed_when: false
  no_log: true
  tags: [deploy]

# ============================================================================
# DIRECTORY STRUCTURE
# ============================================================================

- name: Create application directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ app_data_dir }}"
    - "{{ app_data_dir }}/caddy"
    - "{{ app_data_dir }}/cloudflared"
  tags: [deploy]

- name: Remove SWAG-era files (nginx site-confs, certbot credentials)
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ app_data_dir }}/nginx"
    - "{{ app_data_dir }}/cloudflare.ini"
  tags: [deploy]

# ============================================================================
# CONFIGURATION TEMPLATES
# ============================================================================

- name: Deploy Caddy reverse proxy config
  ansible.builtin.template:
    src: Caddyfile.j2
    dest: "{{ app_data_dir }}/caddy/Caddyfile"
    mode: "0644"
  notify: restart musa stack
  tags: [deploy]

- name: Deploy cloudflared tunnel ingress config
  ansible.builtin.template:
    src: cloudflared-config.yml.j2
    dest: "{{ app_data_dir }}/cloudflared/config.yml"
    mode: "0644"
  notify: restart musa stack
  tags: [deploy]

# The tunnel credential is created once (`cloudflared tunnel create`) and is
# not templated or rotated by this role — only verified.
- name: Check the cloudflared tunnel credential exists
  ansible.builtin.stat:
    path: "{{ app_data_dir }}/cloudflared/credentials.json"
  register: tunnel_cred
  tags: [deploy]

- name: Fail when the tunnel credential is missing
  ansible.builtin.fail:
    msg: >-
      {{ app_data_dir }}/cloudflared/credentials.json is missing. Create the
      tunnel credential with `cloudflared tunnel create {{ cf_tunnel_name }}`
      and place the JSON there (mode 0400, owned by uid 65532).
  when: not tunnel_cred.stat.exists
  tags: [deploy]

- name: Deploy Twenty CRM environment file
  ansible.builtin.template:
    src: env.j2
    dest: "{{ app_data_dir }}/.env"
    mode: "0600"
  notify: restart musa stack
  no_log: true
  tags: [deploy]

- name: Deploy Docker Compose stack
  ansible.builtin.template:
    src: docker-compose.yaml.j2
    dest: "{{ app_data_dir }}/docker-compose.yaml"
    mode: "0644"
  notify: restart musa stack
  tags: [deploy]

# ============================================================================
# DATABASE INITIALIZATION
# ============================================================================
# Twenty's bundled entrypoint runs `database:init:prod` (creates schemas +
# extensions) but does NOT run the entity migrations that create the actual
# core tables (appToken, keyValuePair, user, etc.). On a fresh database the
# server crash-loops because /healthz queries non-existent tables. We run
# `database:migrate:prod` explicitly. Gated on a check of `core.appToken`
# so re-deploys are no-ops.

- name: Bring up db + redis (dependencies for migrate)
  ansible.builtin.command:
    cmd: docker compose up -d db redis
    chdir: "{{ app_data_dir }}"
  changed_when: false
  tags: [deploy]

- name: Wait for db to accept connections
  ansible.builtin.command:
    cmd: docker compose exec -T db pg_isready -U postgres -d twenty
    chdir: "{{ app_data_dir }}"
  register: pg_ready
  until: pg_ready.rc == 0
  retries: 12
  delay: 5
  changed_when: false
  tags: [deploy]

- name: Check whether Twenty's core entity tables exist
  ansible.builtin.command:
    cmd: >-
      docker compose exec -T db psql -U postgres -d twenty -tAc
      "SELECT to_regclass('core.\"appToken\"') IS NOT NULL"
    chdir: "{{ app_data_dir }}"
  register: core_tables_exist
  changed_when: false
  failed_when: false
  tags: [deploy]

- name: Run Twenty database migrations (first deploy only)
  ansible.builtin.command:
    cmd: docker compose run --rm server yarn database:migrate:prod
    chdir: "{{ app_data_dir }}"
  when: (core_tables_exist.stdout | default('') | trim) != 't'
  changed_when: true
  tags: [deploy]

# ============================================================================
# SERVICE STARTUP
# ============================================================================

- name: Start Docker Compose stack
  ansible.builtin.command:
    cmd: docker compose up -d
    chdir: "{{ app_data_dir }}"
  changed_when: false
  tags: [deploy]

# ============================================================================
# HEALTH VERIFICATION
# ============================================================================

- name: Wait for Twenty CRM health check
  ansible.builtin.uri:
    url: "http://localhost:3000/healthz"
    timeout: 10
  register: twenty_health
  until: twenty_health.status == 200
  retries: 12
  delay: 10
  tags: [verify]

# End-to-end: exercises cloudflared -> Caddy -> server through the public edge.
- name: Wait for the public URL to respond through the tunnel
  ansible.builtin.uri:
    url: "https://{{ twenty_domain }}/healthz"
    timeout: 10
  register: edge_health
  until: edge_health.status == 200
  retries: 12
  delay: 10
  tags: [verify]
