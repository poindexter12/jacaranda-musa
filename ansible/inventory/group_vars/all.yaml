---
# Musa Project Group Variables
# Non-secret values only. Secrets injected via justfile deploy recipe.

# Application
app_data_dir: /opt/musa
timezone: America/Denver

# Twenty CRM
twenty_tag: "v2"
twenty_domain: musa-project-crm-test.joeseymour.io
# Additional hostnames Caddy and the tunnel accept (custom domain + legacy alias)
twenty_domain_aliases:
  - crm-test.musa-project.org
  - musa-project-crm-test-caddy.joeseymour.io

# Cloudflare Tunnel (locally managed; credential file lives on the host,
# see roles/musa/tasks — it is verified, never templated)
cf_tunnel_name: musa-project-crm-test
cf_tunnel_id: 24a3799b-6b1c-4d44-868d-1159e770fb71

# Custom images
backup_tag: "latest"
rollup_tag: "latest"
webhook_tag: "latest"
