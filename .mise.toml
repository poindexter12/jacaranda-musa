# mise configuration for jacaranda-musa
#
# mise replaces asdf with faster Rust implementation and cleaner UX.
# Setup: mise trust && mise install
#
# Note: Docker Engine and Docker Compose come bundled with Docker Desktop or Colima
# They are not managed via mise

[tools]
just = "latest"
opentofu = "latest"
uv = "latest"
pre-commit = "latest"
# Note: direnv is a global tool, not managed per-project

[settings]
# Automatically install missing tools when entering directory
auto_install = true

[hooks]
# Create + sync the Python venv after `mise install`. uv sync is idempotent,
# so re-running this on every tool install is cheap. First-time setup
# (`mise trust && mise install`) now produces a ready-to-use .venv,
# silencing the "no venv found at .venv" warning.
postinstall = "uv sync"

[env]
# PATH additions for local scripts and tools
_.path = ["scripts"]
# Activate Python venv (created by uv sync)
_.python.venv = ".venv"

# Shared variables for justfiles
REPO_ROOT = "{{config_root}}"
UV_RUN = "uv run --project {{config_root}}"

# Ansible environment variables
ANSIBLE_INJECT_FACTS_AS_VARS = "False"
ANSIBLE_PYTHON_INTERPRETER = "/usr/bin/python3"
ANSIBLE_SSH_PIPELINING = "True"
ANSIBLE_SSH_ARGS = "-o ControlMaster=auto -o ControlPersist=60s -o IdentitiesOnly=yes"

# Registry (jacaranda-inventory)
REGISTRY_ROOT = "{{config_root}}/../jacaranda-inventory"
REGISTRY_OWNER = "ghcr.io/poindexter12/jacaranda-musa"

# Just settings
JUST_UNSTABLE = "1"
JUST_COMMAND_COLOR = "cyan"
